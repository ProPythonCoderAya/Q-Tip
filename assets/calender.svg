<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#101a3a"/>
      <stop offset=".45" stop-color="#050817"/>
      <stop offset="1" stop-color="#000108"/>
    </radialGradient>

    <!-- Core -->
    <radialGradient id="core">
      <stop offset="0" stop-color="white"/>
      <stop offset=".08" stop-color="#b9ffff"/>
      <stop offset=".25" stop-color="#00ffff"/>
      <stop offset=".55" stop-color="#0088ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#001dff" stop-opacity="0"/>
    </radialGradient>

    <!-- Glows -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

    <!-- Neon gradient -->
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="" stop-color="#00ffff"/>
      <stop offset=".35" stop-color="#008cff"/>
      <stop offset=".7" stop-color="#9b00ff"/>
      <stop offset="1" stop-color="#ff00aa"/>
    </linearGradient>

    <!-- Grid fade -->
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="" stop-color="#00ffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#0066ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Star pattern -->
    <pattern id="stars" width="170" height="170" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="30" r="1.5" fill="#fff"/>
      <circle cx="90" cy="70" r="1" fill="#8ff"/>
      <circle cx="145" cy="20" r="1.2" fill="#fff"/>
      <circle cx="55" cy="145" r=".8" fill="#aaf"/>
      <circle cx="130" cy="120" r=".7" fill="#fff"/>
    </pattern>

    <!-- Animations -->
    <style>
      .spin {
        transform-origin: 500px 470px;
        animation: spin 10s linear infinite;
      }

      .spinReverse {
        transform-origin: 500px 470px;
        animation: spinReverse 6s linear infinite;
      }

      .pulse {
        transform-origin: 500px 470px;
        animation: pulse 1.8s ease-in-out infinite;
      }

      .float {
        animation: float 3s ease-in-out infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes spinReverse {
        to { transform: rotate(-360deg); }
      }

      @keyframes pulse {
        0%,100% { transform: scale(.92); opacity:.7; }
        50% { transform: scale(1.12); opacity:1; }
      }

      @keyframes float {
        0%,100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }
    </style>
  </defs>

  <!-- SPACE -->
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <rect width="1000" height="700" fill="url(#stars)" opacity=".7"/>

  <!-- Giant ambient glow -->
  <circle cx="500" cy="470" r="300"
          fill="#0066ff" opacity=".12" filter="url(#bigGlow)"/>

  <!-- Horizon -->
  <path d="M0 720 Q500 650 1000 720 L1000 1000 L0 1000Z"
        fill="#020514"/>

  <!-- GRID FLOOR -->
  <g stroke="url(#gridFade)" fill="none" opacity=".65">
    <!-- horizontal perspective lines -->
    <path d="M0 750 Q500 700 1000 750"/>
    <path d="M0 790 Q500 735 1000 790"/>
    <path d="M0 840 Q500 770 1000 840"/>
    <path d="M0 900 Q500 815 1000 900"/>
    <path d="M0 970 Q500 870 1000 970"/>

    <!-- perspective lines -->
    <path d="M500 690 L20 1000"/>
    <path d="M500 690 L170 1000"/>
    <path d="M500 690 L300 1000"/>
    <path d="M500 690 L400 1000"/>
    <path d="M500 690 L460 1000"/>
    <path d="M500 690 L540 1000"/>
    <path d="M500 690 L600 1000"/>
    <path d="M500 690 L700 1000"/>
    <path d="M500 690 L830 1000"/>
    <path d="M500 690 L980 1000"/>
  </g>

  <!-- PORTAL SHADOW -->
  <ellipse cx="500" cy="480" rx="300" ry="85"
           fill="#00ffff" opacity=".12" filter="url(#bigGlow)"/>

  <!-- OUTER PORTAL RINGS -->
  <g class="spin" fill="none" filter="url(#glow)">
    <ellipse cx="500" cy="470" rx="285" ry="105"
             stroke="url(#neon)" stroke-width="5"
             stroke-dasharray="12 24"/>

    <ellipse cx="500" cy="470" rx="260" ry="95"
             stroke="#00ffff" stroke-width="2"
             stroke-dasharray="3 18"/>

    <ellipse cx="500" cy="470" rx="225" ry="82"
             stroke="#9b00ff" stroke-width="4"
             stroke-dasharray="35 15 5 20"/>
  </g>

  <g class="spinReverse" fill="none" filter="url(#glow)">
    <ellipse cx="500" cy="470" rx="245" ry="90"
             stroke="#ff00cc" stroke-width="2"
             stroke-dasharray="5 30"/>

    <ellipse cx="500" cy="470" rx="190" ry="70"
             stroke="#00ffff" stroke-width="5"
             stroke-dasharray="2 22"/>
  </g>

  <!-- ENERGY ARCS -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M260 465 A240 90 0 0 1 390 395"
          stroke="#00ffff" stroke-width="10"/>
    <path d="M610 395 A240 90 0 0 1 750 465"
          stroke="#ff00dd" stroke-width="10"/>
    <path d="M735 490 A240 90 0 0 1 620 550"
          stroke="#7b00ff" stroke-width="6"/>
    <path d="M380 550 A240 90 0 0 1 265 490"
          stroke="#0088ff" stroke-width="6"/>
  </g>

  <!-- CORE -->
  <g class="pulse">
    <circle cx="500" cy="470" r="170" fill="url(#core)" opacity=".18"
            filter="url(#bigGlow)"/>
    <circle cx="500" cy="470" r="115" fill="url(#core)" opacity=".25"/>
    <circle cx="500" cy="470" r="55" fill="url(#core)"
            filter="url(#glow)"/>
    <circle cx="500" cy="470" r="17" fill="white"/>
  </g>

  <!-- CORE GEOMETRY -->
  <g class="spin" fill="none" stroke="#dfffff" filter="url(#glow)">
    <polygon points="500,370 575,420 575,520 500,570 425,520 425,420"
             stroke-width="2"/>
    <polygon points="500,400 550,435 550,505 500,540 450,505 450,435"
             stroke-width="3"/>
  </g>

  <!-- Floating energy particles -->
  <g fill="#00ffff" filter="url(#glow)">
    <circle class="float" cx="230" cy="390" r="4"/>
    <circle class="float" cx="780" cy="350" r="3"/>
    <circle class="float" cx="310" cy="570" r="3"/>
    <circle class="float" cx="700" cy="600" r="4"/>
    <circle class="float" cx="180" cy="520" r="2"/>
    <circle class="float" cx="830" cy="500" r="2"/>
  </g>

  <!-- Speed streaks -->
  <g stroke-linecap="round" filter="url(#glow)">
    <path d="M130 280 L250 330" stroke="#00ffff" stroke-width="3"/>
    <path d="M850 260 L730 320" stroke="#ff00dd" stroke-width="3"/>
    <path d="M120 630 L260 580" stroke="#0088ff" stroke-width="2"/>
    <path d="M880 620 L740 570" stroke="#9b00ff" stroke-width="2"/>
  </g>

  <!-- Title -->
  <g text-anchor="middle" font-family="monospace">
    <text x="500" y="120"
          fill="#ffffff"
          font-size="54"
          font-weight="bold"
          letter-spacing="12"
          filter="url(#glow)">
      NEXUS
    </text>

    <text x="500" y="155"
          fill="#00ffff"
          font-size="13"
          letter-spacing="8">
      DIMENSIONAL GATE
    </text>
  </g>

  <!-- Tiny HUD -->
  <g font-family="monospace" font-size="11" fill="#00ffff" opacity=".8">
    <text x="45" y="60">NEXUS // ONLINE</text>
    <text x="45" y="78">CORE: 99.7%</text>
    <text x="790" y="60">PORTAL: STABLE</text>
    <text x="805" y="78">RIFT: OPEN</text>
  </g>

  <!-- Corner brackets -->
  <g fill="none" stroke="#00ffff" stroke-width="3" opacity=".7">
    <path d="M35 150 V110 H75"/>
    <path d="M925 110 H965 V150"/>
    <path d="M35 850 V890 H75"/>
    <path d="M925 890 H965 V850"/>
  </g>

  <!-- Bottom label -->
  <text x="500" y="945"
        text-anchor="middle"
        font-family="monospace"
        font-size="12"
        fill="#6688aa"
        letter-spacing="5">
    ENTER THE NEXUS
  </text>
</svg>